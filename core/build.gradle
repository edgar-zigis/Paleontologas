apply from: "$rootProject.projectDir/shared.build.gradle"
apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'com.zigis.paleontologas.core'
    lint {
        targetSdk 37
    }
    testOptions {
        targetSdk 37
    }
}

dependencies {
    api platform('androidx.compose:compose-bom:2026.09.00')
    api 'androidx.lifecycle:lifecycle-viewmodel-compose'
    api 'androidx.lifecycle:lifecycle-runtime-compose'
    api 'androidx.activity:activity-compose'
    api 'androidx.compose.material3:material3'
    api 'androidx.compose.ui:ui'
    api 'androidx.compose.ui:ui-graphics'
    api 'androidx.compose.ui:ui-tooling-preview'
    api 'androidx.compose.material:material-icons-core'
    api 'androidx.compose.material:material-icons-extended'
    debugApi 'androidx.compose.ui:ui-tooling'

    api 'androidx.constraintlayout:constraintlayout-compose:1.1.2'
    api 'androidx.navigation:navigation-compose:2.10.2'

    api 'androidx.core:core-ktx:1.19.1'
    api 'androidx.core:core-splashscreen:1.2.0'
    api 'com.google.android.material:material:1.14.0'

    api 'com.google.firebase:firebase-crashlytics:20.1.1'
    api 'com.google.firebase:firebase-analytics:23.2.0'

    api 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    api 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0'
    api 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'

    api 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0'

    api "androidx.room:room-runtime:$room_version"
    api "androidx.room:room-ktx:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    api "io.insert-koin:koin-android:$koin_version"
    api "io.insert-koin:koin-androidx-compose:$koin_version"

    api platform("com.google.firebase:firebase-bom:34.19.0")
    api 'com.google.firebase:firebase-auth'
    api 'com.google.firebase:firebase-database'
    api 'com.google.android.gms:play-services-auth:22.0.0'
    api 'androidx.credentials:credentials-play-services-auth:1.6.0'
    api 'com.google.android.libraries.identity.googleid:googleid:1.2.1'
    api 'androidx.credentials:credentials:1.6.0'

    api 'org.greenrobot:eventbus:3.3.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}